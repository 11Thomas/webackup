name: Build WeBackup .fpk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像与 .fpk 版本标签 (如 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set version and lowercase owner
        id: ver
        run: |
          echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner_lower=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

      - name: Unzip source
        run: |
          set -e
          if [ ! -f webackup-pack.zip ]; then
            echo "错误：找不到 webackup-pack.zip"
            exit 1
          fi
          unzip -o webackup-pack.zip
          if [ ! -d webackup ]; then
            mkdir -p webackup-tmp
            find . -maxdepth 1 -mindepth 1 ! -name 'webackup-pack.zip' ! -name 'webackup-tmp' -exec mv {} webackup-tmp/ \;
            mv webackup-tmp webackup
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -e
          IMAGE="ghcr.io/${{ steps.ver.outputs.owner_lower }}/webackup:${TAG}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "$IMAGE" -f webackup/Dockerfile webackup
          docker push "$IMAGE"

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "user/packages/container/webackup/visibility" -f visibility=public || true

      - name: Download fnpack CLI
        env:
          FNPACK_DOWNLOAD_URL: ${{ secrets.FNPACK_DOWNLOAD_URL || 'https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64' }}
        run: |
          curl -sSL -o fnpack "$FNPACK_DOWNLOAD_URL"
          chmod +x fnpack

      - name: Prepare package
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -e
          BUILD_DIR="$(mktemp -d)"
          cp -r webackup/deploy/fnos/. "$BUILD_DIR/"
          node -e "const fs=require('fs');const p='$BUILD_DIR/app/docker/docker-compose.yaml';let s=fs.readFileSync(p,'utf8');s=s.split('__WEBACKUP_IMAGE__').join('$IMAGE');fs.writeFileSync(p,s);"
          chmod +x "$BUILD_DIR/cmd/"*
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: fnpack build
        run: |
          set -e
          ( cd "$BUILD_DIR" && "$GITHUB_WORKSPACE/fnpack" build )

      - name: Create Release with .fpk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -e
          FPK="$(ls ${{ env.BUILD_DIR }}/*.fpk | head -n 1)"
          gh release create "v${TAG}" "$FPK" --title "WeBackup v${TAG}" --notes "自动构建的 fnOS 安装包"

      - name: Upload .fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: webackup-fpk
          path: ${{ env.BUILD_DIR }}/*.fpk
